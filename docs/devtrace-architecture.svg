<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DevTrace system architecture</title>
  <desc id="desc">Production troubleshooting flow from incident input through normalization, hybrid retrieval, applicability filtering, diagnosis, batched claim verification, root-cause survival, retry, and final outcomes, with corpus indexing and evaluation branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081018"/>
      <stop offset="1" stop-color="#111b28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7a8"/>
      <stop offset="1" stop-color="#65a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ee7a8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#65a7ff"/>
    </marker>
    <style>
      .title { font: 700 42px Inter,Segoe UI,Arial,sans-serif; fill:#f5f7fb; letter-spacing:-1px }
      .subtitle { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill:#9baabd }
      .eyebrow { font: 700 13px Inter,Segoe UI,Arial,sans-serif; fill:#5ee7a8; letter-spacing:2px }
      .module { font: 700 13px Inter,Segoe UI,Arial,sans-serif; fill:#5ee7a8; letter-spacing:1.4px }
      .nodeTitle { font: 700 22px Inter,Segoe UI,Arial,sans-serif; fill:#f5f7fb }
      .nodeText { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill:#aeb9c8 }
      .small { font: 400 13px Inter,Segoe UI,Arial,sans-serif; fill:#94a3b8 }
      .strong { font: 650 14px Inter,Segoe UI,Arial,sans-serif; fill:#e9eef5 }
      .pill { font: 700 12px Inter,Segoe UI,Arial,sans-serif; fill:#07130e; letter-spacing:.4px }
      .box { fill:#121e2b; stroke:#26384a; stroke-width:1.4 }
      .boxAccent { fill:#10251f; stroke:#34785e; stroke-width:1.6 }
      .boxBlue { fill:#111f32; stroke:#315c88; stroke-width:1.5 }
      .boxAmber { fill:#282317; stroke:#7a6330; stroke-width:1.5 }
      .line { fill:none; stroke:#5ee7a8; stroke-width:2.2; marker-end:url(#arrow) }
      .lineBlue { fill:none; stroke:#65a7ff; stroke-width:1.8; marker-end:url(#arrowBlue) }
      .lineDash { fill:none; stroke:#64778d; stroke-width:1.5; stroke-dasharray:7 7 }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
  <circle cx="1460" cy="-30" r="250" fill="#5ee7a8" opacity=".045"/>
  <circle cx="80" cy="1030" r="300" fill="#65a7ff" opacity=".04"/>

  <text x="60" y="62" class="eyebrow">DEVTRACE · EVIDENCE-GROUNDED DEVELOPER TROUBLESHOOTING</text>
  <text x="60" y="112" class="title">Retrieved ≠ Applicable ≠ Supported ≠ Survived</text>
  <text x="60" y="145" class="subtitle">A version-aware RAG pipeline that exposes its evidence trail and refuses unsupported root causes.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="175" width="1480" height="58" rx="14" class="boxBlue"/>
    <text x="82" y="199" class="module">M1 · SHARED FOUNDATION</text>
    <text x="82" y="220" class="small">Typed Pydantic contracts · configuration · error boundaries · LLM abstraction · deterministic test doubles</text>
    <rect x="1328" y="189" width="188" height="30" rx="15" fill="url(#accent)"/>
    <text x="1422" y="209" text-anchor="middle" class="pill">PYTHON 3.11</text>
  </g>

  <!-- production flow -->
  <text x="60" y="275" class="eyebrow">PRODUCTION TROUBLESHOOTING PATH</text>

  <g filter="url(#shadow)">
    <rect x="60" y="305" width="170" height="175" rx="18" class="box"/>
    <text x="82" y="334" class="module">M8 · INPUT</text>
    <text x="82" y="369" class="nodeTitle">Incident</text>
    <text x="82" y="399" class="nodeText">Description</text>
    <text x="82" y="421" class="nodeText">SDK/API versions</text>
    <text x="82" y="443" class="nodeText">Error codes</text>
    <text x="82" y="465" class="nodeText">Product context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="305" width="175" height="175" rx="18" class="box"/>
    <text x="292" y="334" class="module">M2</text>
    <text x="292" y="369" class="nodeTitle">Normalize</text>
    <text x="292" y="399" class="nodeText">Validate input</text>
    <text x="292" y="421" class="nodeText">Extract signals</text>
    <text x="292" y="443" class="nodeText">Canonicalize versions</text>
    <text x="292" y="465" class="nodeText">Build traceable incident</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="285" width="210" height="215" rx="18" class="box"/>
    <text x="507" y="315" class="module">M3</text>
    <text x="507" y="350" class="nodeTitle">Hybrid retrieval</text>
    <text x="507" y="380" class="strong">Dense semantic search</text>
    <text x="507" y="401" class="nodeText">MiniLM embeddings + Chroma</text>
    <text x="507" y="432" class="strong">Sparse exact search</text>
    <text x="507" y="453" class="nodeText">BM25 + technical signals</text>
    <text x="507" y="481" class="small">Score fusion + explainable boosts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="265" width="220" height="255" rx="18" class="box"/>
    <text x="757" y="295" class="module">M4</text>
    <text x="757" y="330" class="nodeTitle">Reasoning gate</text>
    <text x="757" y="365" class="strong">1 · NEEDS_INFO check</text>
    <text x="757" y="387" class="nodeText">Stop when required facts</text>
    <text x="757" y="406" class="nodeText">cannot be inferred safely.</text>
    <text x="757" y="437" class="strong">2 · Applicability filter</text>
    <text x="757" y="459" class="nodeText">Exclude wrong-version and</text>
    <text x="757" y="478" class="nodeText">out-of-scope evidence.</text>
    <text x="757" y="507" class="strong">3 · Structured diagnosis</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="995" y="265" width="230" height="255" rx="18" class="boxAccent"/>
    <text x="1017" y="295" class="module">M5 · TRUST BOUNDARY</text>
    <text x="1017" y="330" class="nodeTitle">Verify every claim</text>
    <text x="1017" y="365" class="strong">Deterministic first</text>
    <text x="1017" y="387" class="nodeText">Cited ID must exist in the</text>
    <text x="1017" y="406" class="nodeText">applicable evidence bundle.</text>
    <text x="1017" y="437" class="strong">Semantic second</text>
    <text x="1017" y="459" class="nodeText">Support · sufficiency ·</text>
    <text x="1017" y="478" class="nodeText">contradiction, per claim.</text>
    <rect x="1017" y="491" width="182" height="22" rx="11" fill="#5ee7a8"/>
    <text x="1108" y="507" text-anchor="middle" class="pill">1 BATCHED API REQUEST</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1265" y="265" width="275" height="255" rx="18" class="box"/>
    <text x="1287" y="295" class="module">M6</text>
    <text x="1287" y="330" class="nodeTitle">Root-cause survival</text>
    <text x="1287" y="365" class="nodeText">Only verified claims can enter</text>
    <text x="1287" y="386" class="nodeText">the final answer.</text>
    <text x="1287" y="420" class="strong">Root cause rejected?</text>
    <text x="1287" y="442" class="nodeText">Run one targeted diagnosis</text>
    <text x="1287" y="463" class="nodeText">retry against applicable evidence.</text>
    <rect x="1287" y="483" width="128" height="22" rx="11" fill="#f4c66a"/>
    <text x="1351" y="499" text-anchor="middle" class="pill">MAX 1 RETRY</text>
  </g>

  <path d="M230 392 H260" class="line"/>
  <path d="M445 392 H475" class="line"/>
  <path d="M695 392 H725" class="line"/>
  <path d="M955 392 H985" class="line"/>
  <path d="M1225 392 H1255" class="line"/>

  <!-- dependencies and exits -->
  <g filter="url(#shadow)">
    <rect x="60" y="570" width="635" height="150" rx="18" class="boxBlue"/>
    <text x="82" y="600" class="module">KNOWLEDGE &amp; INDEXING</text>
    <text x="82" y="635" class="nodeTitle">Controlled DevCore corpus</text>
    <text x="82" y="666" class="nodeText">33 fictional technical documents → stable document/chunk IDs → metadata</text>
    <text x="82" y="691" class="nodeText">One chunk per document → in-memory BM25 + persistent Chroma vector index</text>
    <rect x="516" y="605" width="153" height="28" rx="14" fill="#65a7ff"/>
    <text x="592" y="624" text-anchor="middle" class="pill">EVIDENCE SOURCE</text>
  </g>
  <path d="M590 570 V510" class="lineBlue"/>

  <g filter="url(#shadow)">
    <rect x="735" y="570" width="220" height="150" rx="18" class="boxAmber"/>
    <text x="757" y="600" class="module" fill="#f4c66a">SAFE EARLY EXIT</text>
    <text x="757" y="635" class="nodeTitle">NEEDS_INFO</text>
    <text x="757" y="666" class="nodeText">Ask for the version or</text>
    <text x="757" y="687" class="nodeText">other decisive context.</text>
  </g>
  <path d="M845 520 V560" class="lineBlue"/>

  <g filter="url(#shadow)">
    <rect x="995" y="570" width="230" height="150" rx="18" class="boxBlue"/>
    <text x="1017" y="600" class="module">MODEL PROVIDER</text>
    <text x="1017" y="635" class="nodeTitle">Gemini Flash-Lite</text>
    <text x="1017" y="666" class="nodeText">Diagnosis generation</text>
    <text x="1017" y="687" class="nodeText">Batched structured verification</text>
  </g>
  <path d="M1110 570 V530" class="lineBlue"/>

  <g filter="url(#shadow)">
    <rect x="1265" y="570" width="275" height="150" rx="18" class="boxAccent"/>
    <text x="1287" y="600" class="module">M8 · PRESENTATION</text>
    <text x="1287" y="635" class="nodeTitle">Final outcome</text>
    <text x="1287" y="665" class="nodeText">ANSWERED_FULL / PARTIAL</text>
    <text x="1287" y="687" class="nodeText">INSUFFICIENT · NEEDS_INFO · DEGRADED</text>
  </g>
  <path d="M1402 520 V560" class="line"/>

  <!-- evaluation lane -->
  <path d="M845 735 V772" class="lineDash"/>
  <g filter="url(#shadow)">
    <rect x="60" y="790" width="1480" height="155" rx="18" class="box"/>
    <text x="82" y="821" class="module">M7 · SEPARATE EVALUATION BRANCH — NOT PART OF PRODUCTION REASONING</text>
    <text x="82" y="858" class="nodeTitle">37-case benchmark</text>
    <text x="82" y="889" class="nodeText">Naive hybrid RAG</text>
    <text x="82" y="912" class="nodeText">Baseline A</text>
    <text x="330" y="889" class="nodeText">Threshold RAG</text>
    <text x="330" y="912" class="nodeText">Baseline B</text>
    <text x="560" y="889" class="nodeText">Full M1–M6 pipeline</text>
    <text x="560" y="912" class="nodeText">DevTrace</text>
    <text x="850" y="858" class="strong">Measures</text>
    <text x="850" y="889" class="nodeText">retrieval · applicability · citations · false answers · abstention · retry</text>
    <rect x="1275" y="850" width="235" height="48" rx="24" fill="url(#accent)"/>
    <text x="1392" y="879" text-anchor="middle" class="pill">JSON + MARKDOWN REPORTS</text>
  </g>

  <text x="60" y="978" class="small">Production invariant: retrieved evidence can be rejected before generation; generated claims can be rejected before the final answer.</text>
</svg>
