<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">DevTrace system architecture</title>
  <desc id="desc">A user incident enters through the M8 Streamlit adapter. M6 orchestrates M2 normalization, M3 hybrid retrieval, M4 missing-information and applicability gates plus diagnosis, M5 claim verification, bounded retry, final-answer assembly, and M8 presentation. M2 corpus ingestion and M7 evaluation are shown as separate supporting paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081018"/><stop offset="1" stop-color="#111b28"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7a8"/><stop offset="1" stop-color="#65a7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ee7a8"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#65a7ff"/></marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#f5f7fb;letter-spacing:-1px}.subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#9baabd}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#5ee7a8;letter-spacing:2px}.module{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#5ee7a8;letter-spacing:1.4px}.moduleAmber{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#f4c66a;letter-spacing:1.4px}.nodeTitle{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f5f7fb}.nodeText{font:400 13.5px Inter,Segoe UI,Arial,sans-serif;fill:#aeb9c8}.small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.strong{font:650 13.5px Inter,Segoe UI,Arial,sans-serif;fill:#e9eef5}.pill{font:700 11.5px Inter,Segoe UI,Arial,sans-serif;fill:#07130e;letter-spacing:.35px}.box{fill:#121e2b;stroke:#26384a;stroke-width:1.4}.boxAccent{fill:#10251f;stroke:#34785e;stroke-width:1.6}.boxBlue{fill:#111f32;stroke:#315c88;stroke-width:1.5}.boxAmber{fill:#282317;stroke:#7a6330;stroke-width:1.5}.line{fill:none;stroke:#5ee7a8;stroke-width:2.2;marker-end:url(#arrow)}.lineBlue{fill:none;stroke:#65a7ff;stroke-width:1.8;marker-end:url(#arrowBlue)}.lineDash{fill:none;stroke:#64778d;stroke-width:1.5;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1100" rx="28" fill="url(#bg)"/><circle cx="1460" cy="-30" r="250" fill="#5ee7a8" opacity=".045"/><circle cx="80" cy="1130" r="300" fill="#65a7ff" opacity=".04"/>
  <text x="40" y="58" class="eyebrow">DEVTRACE &#183; EVIDENCE-GROUNDED DEVELOPER TROUBLESHOOTING</text>
  <text x="40" y="108" class="title">Retrieved &#8800; Applicable &#8800; Supported &#8800; Survived</text>
  <text x="40" y="141" class="subtitle">A version-aware RAG pipeline that exposes its evidence trail and refuses unsupported root causes.</text>
  <g filter="url(#shadow)"><rect x="40" y="168" width="1520" height="58" rx="14" class="boxBlue"/><text x="62" y="192" class="module">M1 &#183; SHARED FOUNDATION</text><text x="62" y="213" class="small">Typed Pydantic contracts &#183; configuration &#183; errors &#183; outcome types &#183; LLM abstraction &#183; deterministic test doubles</text><rect x="1350" y="182" width="186" height="30" rx="15" fill="url(#accent)"/><text x="1443" y="202" text-anchor="middle" class="pill">PYTHON 3.11</text></g>
  <text x="40" y="266" class="eyebrow">PRODUCTION DATA PATH</text><text x="278" y="266" class="small">M8 adapts the UI request; M6 orchestrates M2&#8211;M5 and owns the final outcome.</text>
  <path d="M420 286 H1275" class="lineDash"/><text x="848" y="282" text-anchor="middle" class="module">M6 ORCHESTRATES THIS EXECUTION</text>

  <g filter="url(#shadow)"><rect x="30" y="315" width="150" height="220" rx="18" class="box"/><text x="50" y="344" class="moduleAmber">USER INPUT</text><text x="50" y="379" class="nodeTitle">Incident</text><text x="50" y="410" class="nodeText">Description</text><text x="50" y="432" class="nodeText">SDK/API versions</text><text x="50" y="454" class="nodeText">Error codes</text><text x="50" y="476" class="nodeText">Product context</text><text x="50" y="510" class="small">External data, not</text><text x="50" y="528" class="small">a numbered module</text></g>
  <g filter="url(#shadow)"><rect x="210" y="315" width="160" height="220" rx="18" class="boxBlue"/><text x="230" y="344" class="module">M8 &#183; UI BOUNDARY</text><text x="230" y="379" class="nodeTitle">Adapt request</text><text x="230" y="410" class="nodeText">Map form fields</text><text x="230" y="432" class="nodeText">Choose fake/live LLM</text><text x="230" y="454" class="nodeText">Initialize retriever</text><text x="230" y="476" class="nodeText">Invoke M6 entry point</text><text x="230" y="510" class="small">No diagnosis logic</text></g>
  <g filter="url(#shadow)"><rect x="400" y="315" width="165" height="220" rx="18" class="box"/><text x="420" y="344" class="module">M2</text><text x="420" y="379" class="nodeTitle">Normalize</text><text x="420" y="410" class="nodeText">Validate input</text><text x="420" y="432" class="nodeText">Extract signals</text><text x="420" y="454" class="nodeText">Canonicalize versions</text><text x="420" y="476" class="nodeText">Build typed incident</text><text x="420" y="510" class="small">Also owns corpus</text><text x="420" y="528" class="small">loading + chunking</text></g>
  <g filter="url(#shadow)"><rect x="595" y="300" width="195" height="250" rx="18" class="box"/><text x="615" y="329" class="module">M3</text><text x="615" y="364" class="nodeTitle">Hybrid retrieval</text><text x="615" y="396" class="strong">Dense search</text><text x="615" y="417" class="nodeText">MiniLM + Chroma</text><text x="615" y="448" class="strong">Sparse search</text><text x="615" y="469" class="nodeText">BM25 exact terms</text><text x="615" y="500" class="strong">Fusion + boosts</text><text x="615" y="521" class="small">Rank candidates only</text></g>
  <g filter="url(#shadow)"><rect x="820" y="285" width="210" height="280" rx="18" class="box"/><text x="840" y="314" class="module">M4</text><text x="840" y="349" class="nodeTitle">Gate &amp; diagnose</text><text x="840" y="382" class="strong">1 &#183; NEEDS_INFO gate</text><text x="840" y="403" class="nodeText">Stop on missing decisive facts.</text><text x="840" y="434" class="strong">2 &#183; Applicability filter</text><text x="840" y="455" class="nodeText">Exclude wrong-version and</text><text x="840" y="475" class="nodeText">out-of-scope evidence.</text><text x="840" y="506" class="strong">3 &#183; Structured diagnosis</text><text x="840" y="527" class="nodeText">Root cause &#183; fix &#183; explanation</text><text x="840" y="548" class="small">Applicable evidence only</text></g>
  <g filter="url(#shadow)"><rect x="1060" y="285" width="220" height="280" rx="18" class="boxAccent"/><text x="1080" y="314" class="module">M5 &#183; TRUST BOUNDARY</text><text x="1080" y="349" class="nodeTitle">Verify each claim</text><text x="1080" y="382" class="strong">Deterministic first</text><text x="1080" y="403" class="nodeText">Cited IDs must exist in the</text><text x="1080" y="423" class="nodeText">applicable evidence bundle.</text><text x="1080" y="454" class="strong">Semantic second</text><text x="1080" y="475" class="nodeText">Support &#183; sufficiency &#183;</text><text x="1080" y="495" class="nodeText">contradiction, per claim.</text><rect x="1080" y="520" width="176" height="24" rx="12" fill="#5ee7a8"/><text x="1168" y="536" text-anchor="middle" class="pill">1 LIVE BATCH REQUEST</text></g>
  <g filter="url(#shadow)"><rect x="1310" y="285" width="260" height="280" rx="18" class="box"/><text x="1330" y="314" class="module">M6 &#183; ORCHESTRATION</text><text x="1330" y="349" class="nodeTitle">Survive &amp; assemble</text><text x="1330" y="382" class="nodeText">Require verified root cause.</text><text x="1330" y="413" class="strong">Root cause rejected?</text><text x="1330" y="434" class="nodeText">If applicable evidence remains,</text><text x="1330" y="454" class="nodeText">run one targeted retry.</text><text x="1330" y="485" class="strong">Final-answer assembly</text><text x="1330" y="506" class="nodeText">Include verified claims only;</text><text x="1330" y="526" class="nodeText">emit one typed outcome.</text><rect x="1330" y="536" width="124" height="22" rx="11" fill="#f4c66a"/><text x="1392" y="551" text-anchor="middle" class="pill">MAX 1 RETRY</text></g>
  <path d="M180 425 H200" class="line"/><path d="M370 425 H390" class="line"/><path d="M565 425 H585" class="line"/><path d="M790 425 H810" class="line"/><path d="M1030 425 H1050" class="line"/><path d="M1280 425 H1300" class="line"/>

  <g filter="url(#shadow)"><rect x="30" y="625" width="535" height="155" rx="18" class="boxBlue"/><text x="52" y="655" class="module">M2 &#183; CORPUS INGESTION</text><text x="52" y="690" class="nodeTitle">Controlled DevCore knowledge</text><text x="52" y="721" class="nodeText">33 fictional documents &#8594; validation &#8594; stable document/chunk IDs + metadata</text><text x="52" y="746" class="nodeText">One chunk per document &#8594; in-memory BM25 + persistent Chroma vector index</text><rect x="390" y="649" width="151" height="27" rx="14" fill="#65a7ff"/><text x="466" y="667" text-anchor="middle" class="pill">EVIDENCE SOURCE</text></g><path d="M480 625 V575 H692 V560" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="595" y="625" width="220" height="155" rx="18" class="boxAmber"/><text x="617" y="655" class="moduleAmber">M4 &#183; EARLY GATE</text><text x="617" y="690" class="nodeTitle">NEEDS_INFO signal</text><text x="617" y="721" class="nodeText">No diagnosis is generated when</text><text x="617" y="742" class="nodeText">decisive context is missing.</text><text x="617" y="766" class="small">M6 maps it to the final outcome.</text></g><path d="M925 565 V595 H705 V615" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="845" y="625" width="300" height="155" rx="18" class="boxBlue"/><text x="867" y="655" class="module">MODEL PROVIDER</text><text x="867" y="690" class="nodeTitle">Gemini 3.5 Flash-Lite</text><text x="867" y="721" class="nodeText">M4 diagnosis generation</text><text x="867" y="742" class="nodeText">M5 batched semantic verification</text><text x="867" y="763" class="small">Fake client supports deterministic tests</text></g><path d="M995 625 V590 H1170 V575" class="lineBlue"/>
  <g filter="url(#shadow)"><rect x="1175" y="625" width="395" height="155" rx="18" class="boxAccent"/><text x="1197" y="655" class="module">M8 &#183; PRESENTATION</text><text x="1197" y="690" class="nodeTitle">Render result, no new reasoning</text><text x="1197" y="721" class="nodeText">Answer or abstention &#183; pipeline trace &#183; verification verdicts</text><text x="1197" y="746" class="nodeText">Retrieved/applicable evidence &#183; exclusions &#183; retry details</text><rect x="1379" y="649" width="167" height="27" rx="14" fill="url(#accent)"/><text x="1462" y="667" text-anchor="middle" class="pill">FIVE OUTCOMES</text></g><path d="M1440 565 V615" class="line"/>

  <path d="M1440 790 V825" class="lineDash"/><g filter="url(#shadow)"><rect x="30" y="840" width="1540" height="180" rx="18" class="box"/><text x="52" y="871" class="module">M7 &#183; SEPARATE EVALUATION BRANCH &#8212; NEVER INJECTS GOLD DATA INTO PRODUCTION REASONING</text><text x="52" y="908" class="nodeTitle">37 controlled fixtures invoke the baselines and full pipeline</text><text x="52" y="941" class="nodeText">Baseline A: naive hybrid RAG</text><text x="315" y="941" class="nodeText">Baseline B: threshold RAG</text><text x="582" y="941" class="nodeText">DevTrace: full M1&#8211;M6 path</text><text x="52" y="972" class="small">Gold labels are compared only after each run. Measures retrieval, forbidden retrieval, citation validity/correctness, false answers, abstention, and retry.</text><rect x="1300" y="902" width="238" height="48" rx="24" fill="url(#accent)"/><text x="1419" y="931" text-anchor="middle" class="pill">JSON + MARKDOWN REPORTS</text></g>
  <text x="30" y="1064" class="small">M6 outcomes: ANSWERED_FULL &#183; ANSWERED_PARTIAL &#183; INSUFFICIENT_EVIDENCE &#183; NEEDS_INFO &#183; DEGRADED</text><text x="30" y="1085" class="small">Trust invariant: retrieved evidence may fail applicability; generated claims may fail verification; only surviving verified claims reach the answer.</text>
</svg>
